<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="256" fill="#0066cc"/>

  <!-- Radio Waves -->
  <g stroke="white" stroke-width="12" fill="none" stroke-linecap="round">
    <!-- Center Circle (antenna base) -->
    <circle cx="256" cy="256" r="30"/>

    <!-- Radio waves -->
    <circle cx="256" cy="256" r="70" opacity="0.8"/>
    <circle cx="256" cy="256" r="120" opacity="0.6"/>

    <!-- Antenna -->
    <line x1="256" y1="180" x2="256" y2="80" stroke-width="16"/>
    <circle cx="256" cy="60" r="20"/>
  </g>

  <!-- Microphone element -->
  <g fill="white">
    <ellipse cx="256" cy="320" rx="30" ry="50"/>
    <rect x="240" y="370" width="32" height="60" rx="16"/>
    <circle cx="256" cy="440" r="20"/>
  </g>
</svg>
