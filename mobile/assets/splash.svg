<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 1024">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0066cc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#004399;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="512" height="1024" fill="url(#bgGradient)"/>

  <!-- Center Content -->
  <g transform="translate(256, 400)">
    <!-- App Icon Large -->
    <circle cx="0" cy="-100" r="80" fill="white" opacity="0.2"/>
    <g stroke="white" stroke-width="8" fill="none" stroke-linecap="round">
      <circle cx="0" cy="-100" r="25"/>
      <circle cx="0" cy="-100" r="50" opacity="0.7"/>
      <circle cx="0" cy="-100" r="75" opacity="0.4"/>
      <line x1="0" y1="-175" x2="0" y2="-230" stroke-width="12"/>
      <circle cx="0" cy="-245" r="15"/>
    </g>

    <!-- App Title -->
    <text x="0" y="80" font-family="Arial, sans-serif" font-size="56" font-weight="bold"
          fill="white" text-anchor="middle">
      Radio Recorder
    </text>

    <!-- Tagline -->
    <text x="0" y="140" font-family="Arial, sans-serif" font-size="28"
          fill="white" opacity="0.9" text-anchor="middle">
      Record • Analyze • Enjoy
    </text>
  </g>

  <!-- Loading Indicator -->
  <g transform="translate(256, 850)">
    <circle cx="-30" cy="0" r="8" fill="white" opacity="0.8"/>
    <circle cx="0" cy="0" r="8" fill="white" opacity="0.5"/>
    <circle cx="30" cy="0" r="8" fill="white" opacity="0.3"/>
  </g>
</svg>
